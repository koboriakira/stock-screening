[project]
name = "stock-screener"
version = "0.1.0"
description = "小型バリュー株スクリーニングシステム"
requires-python = ">=3.12"
dependencies = [
    "yfinance>=0.2.40",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "xlrd>=2.0.1",
]

[project.scripts]
stock-screener = "stock_screener.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/stock_screener"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py312"
fix = true
src = ["src"]
line-length = 120

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "D",
    "TD",
    "FIX",
    "T201",
    "TRY",
    "S101",
    "INP001",
    "ANN",
    "ERA",
    "FBT",
    "PLR0913",
    "PLR2004",
    "TC001",
    "TC003",
    "RUF001",
    "BLE001",
    "S105",
    "ARG002",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.5.0",
]
